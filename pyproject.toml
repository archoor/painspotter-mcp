[project]
name = "painspotter-mcp"
version = "1.1.0"
description = "PainSpotter MCP Server — query business opportunities and blog analyses in Claude/Cursor"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
painspotter-mcp = "painspotter_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
